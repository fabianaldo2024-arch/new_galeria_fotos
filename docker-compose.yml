version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=galeria_db

  redis:
    image: redis:alpine

  app:
    build: 
      context: .
      dockerfile: dockerfile  # Usamos el nombre en minúsculas como se ve en tu explorador [1]
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./thumbnails:/app/thumbnails

volumes:
  postgres_data: