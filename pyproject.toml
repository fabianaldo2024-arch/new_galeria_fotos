[tool.poetry]
name = "new-galeria-foto"
version = "0.1.0"
description = "Portfolio de fotos digitales - API robusta y escalable"
authors = ["Tu Nombre <tu.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]   # indica que 'app' es el paquete Python raíz

[tool.poetry.dependencies]
python = "^3.11"                   # o 3.12, según tu sistema
fastapi = {extras = ["standard"], version = "^0.115.0"}   # incluye uvicorn, etc.
uvicorn = {version = "^0.28.0", extras = ["standard"]}    # servidor ASGI
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
asyncpg = "^0.29.0"               # driver asíncrono PostgreSQL
alembic = "^1.13.0"
pydantic-settings = "^2.2.0"
python-multipart = "^0.0.9"       # necesario para subida de archivos
aiofiles = "^24.1.0"              # manejo asíncrono de archivos
arq = "^0.26.0"                   # cola de tareas basada en Redis
redis = "^5.0.0"                  # cliente Python para Redis (arq lo necesita)
email-validator = "^2.3.0"
pillow = "^12.2.0"
python-magic = "^0.4.27"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"                 # cliente HTTP asíncrono para tests
ruff = "^0.5.0"                   # linter + formateador rápido
pre-commit = "^3.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Configuración básica de Ruff
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]   # pycodestyle, pyflakes, isort, pep8-naming, warnings

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]